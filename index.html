<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#FAF7F2">
  <meta name="description" content="Scan the table QR and see the real dish in 3D, on your own table at true size, before you order. No app. Lahore.">
  <!-- Link previews (WhatsApp, Instagram DMs, Facebook). These bots don't run JavaScript, so the tags
       live in the static HTML. Absolute URLs: switch to the custom domain when it is live. -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="MENVA">
  <meta property="og:title" content="MENVA — See it on your table. Then order it.">
  <meta property="og:description" content="Real dishes, scanned in 3D, on your own table at true size, before you order. No app.">
  <meta property="og:url" content="https://menva-ar.netlify.app/">
  <meta property="og:image" content="https://menva-ar.netlify.app/assets/og.jpg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="A real steak sandwich, scanned in 3D, beside the words: See it on your table. Then order it.">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="MENVA">
  <title>MENVA — See it before you order it</title>
  <link rel="icon" href="/assets/logo.svg" type="image/svg+xml">

  <!-- Dark mode bootstrap (runs before paint, no flash) -->
  <script src="/js/appearance.js"></script>

  <!-- Fonts are self-hosted (see css/base.css); preload the body weight -->
  <link rel="preload" href="/vendor/fonts/dm-sans-400.woff2" as="font" type="font/woff2" crossorigin>

  <!-- Menu data: fetched by js/app.js; preload so it downloads alongside the CSS -->
  <link rel="preload" href="/data/menu.json" as="fetch" crossorigin>

  <!-- Styles -->
  <link rel="stylesheet" href="/css/tokens.css">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/toggle.css">
  <link rel="stylesheet" href="/css/loader.css">
  <link rel="stylesheet" href="/css/hero.css">
</head>
<body>
  <div id="app"></div>
  <script src="/js/analytics.js" defer></script>
  <script src="/js/capabilities.js" defer></script>
  <script src="/js/viewer.js" defer></script>
  <script src="/js/spin.js" defer></script>
  <script src="/js/loader.js" defer></script>
  <script src="/js/tray.js" defer></script>
  <script src="/js/app.js" defer></script>
</body>
</html>
