<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#FAF5EA">
  <meta name="description" content="MENVA — See it before you order it. Your good food looks better here.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="MENVA">
  <title>MENVA — See it before you order it</title>
  <link rel="icon" href="/assets/logo.svg" type="image/svg+xml">

  <!-- Dark mode bootstrap (runs before paint, no flash) -->
  <script src="/js/appearance.js"></script>

  <!-- Fonts are self-hosted (see css/base.css); preload the body weight -->
  <link rel="preload" href="/vendor/fonts/dm-sans-400.woff2" as="font" type="font/woff2" crossorigin>

  <!-- Menu data: fetched by js/app.js; preload so it downloads alongside the CSS -->
  <link rel="preload" href="/data/build/dishes.json" as="fetch" crossorigin>

  <!-- Styles -->
  <link rel="stylesheet" href="/css/tokens.css">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/toggle.css">
</head>
<body>
  <div id="app"></div>
  <script src="/js/viewer.js" defer></script>
  <script src="/js/app.js" defer></script>
</body>
</html>
