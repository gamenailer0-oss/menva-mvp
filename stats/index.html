<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>MENVA — Pilot results</title>
  <link rel="icon" href="/assets/logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/stats/stats.css">
</head>
<body>
  <main>
    <header>
      <h1>Pilot results</h1>
      <p id="meta">Loading…</p>
      <div class="controls">
        <label>Days <select id="days"><option>7</option><option selected>14</option><option>30</option><option>90</option></select></label>
        <a id="csv" class="button" href="#">Download CSV</a>
      </div>
    </header>
    <p id="message" role="status"></p>
    <section>
      <h2>By day</h2>
      <div class="scroll"><table id="by-day"></table></div>
    </section>
    <section>
      <h2>By dish</h2>
      <div class="scroll"><table id="by-dish"></table></div>
    </section>
    <p class="note">Tiers: 1 iPhone AR · 2 Android AR · 3 3D only · 4 360° view · 5 photo. Rates are per dish opened. Times are medians. No personal data is collected.</p>
  </main>
  <script src="/stats/stats.js" defer></script>
</body>
</html>
