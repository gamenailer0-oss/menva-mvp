# Only dist/ is published (see scripts/build.mjs) so repo files like CLAUDE.md,
# scripts/ and node_modules/ never become public. vendor/ is committed, so the
# build is a plain copy and needs no network.
[build]
  command = "npm run build"
  publish = "dist"

# Analytics: netlify/functions/e.mjs (POST /api/e) and stats.mjs (GET /api/stats), stored in
# Netlify Blobs. Needs a Git-connected or CLI deploy — drag-and-drop does not deploy functions.
# Set STATS_KEY (32+ random characters) under Site configuration → Environment variables.
[functions]
  directory = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"
  AWS_LAMBDA_JS_RUNTIME = "nodejs22.x"

# ── Security (every response) ─────────────────────────────────
# Only our own origin is allowed for anything. 'wasm-unsafe-eval' is for the Draco decoder
# (WebAssembly); blob: workers/fetches are how three.js decodes meshes and embedded textures.
# Inline style *attributes* are used for per-dish blur placeholders, hence 'unsafe-inline' on
# style-src only — never on scripts.
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self' blob: data:; worker-src 'self' blob:; media-src 'self' blob:; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'; frame-ancestors 'none'"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "same-origin"
    Permissions-Policy = "camera=(self), xr-spatial-tracking=(self), geolocation=(), microphone=(), payment=(), usb=()"
    Strict-Transport-Security = "max-age=31536000"
    Cross-Origin-Opener-Policy = "same-origin"

# ── Content types ─────────────────────────────────────────────
# iOS Quick Look refuses a .usdz served with the wrong type.
[[headers]]
  for = "/*.glb"
  [headers.values]
    Content-Type = "model/gltf-binary"

[[headers]]
  for = "/*.usdz"
  [headers.values]
    Content-Type = "model/vnd.usdz+zip"

[[headers]]
  for = "/*.wasm"
  [headers.values]
    Content-Type = "application/wasm"

[[headers]]
  for = "/favicon.ico"
  [headers.values]
    Content-Type = "image/x-icon"

[[headers]]
  for = "/site.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"

# ── Caching ───────────────────────────────────────────────────
# Immutable: these URLs must change whenever their content changes.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/vendor/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Always revalidate: the app shell, menu data and the service worker itself.
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/data/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# ── Routing ───────────────────────────────────────────────────
# Table URLs (/g/12, /baraza/4) serve that restaurant's page, which has its own static SEO tags
# (scripts/build.mjs writes dist/<slug>/index.html). The table segment is one path segment only
# (:table), so /g/1/2 is a real 404. scripts/build.mjs adds the same rule for any restaurant in the
# menu data that is missing here.
#
# There is deliberately NO catch-all (/*  /index.html  200): it made every unknown URL answer 200
# (a "soft 404", which Google penalises). Anything that matches no file and no rule above gets
# dist/404.html with a real 404 status — Cloudflare Pages and Netlify both do this automatically.
[[redirects]]
  from = "/g/:table"
  to = "/g/"
  status = 200

[[redirects]]
  from = "/baraza/:table"
  to = "/baraza/"
  status = 200

[[redirects]]
  from = "/haute-dolci/:table"
  to = "/haute-dolci/"
  status = 200
