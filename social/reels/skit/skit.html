<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Table Edition</title>
<!-- "Madam ki Class: Table Edition". Four friends at a restaurant table; one of them turns into Madam.
     skit.mjs passes the cast (SVGs) and a timeline; render(t) draws any moment, so frames are reproducible. -->
<style>
@font-face { font-family: 'Instrument Serif'; src: url(../../../vendor/fonts/instrument-serif-400.woff2) format('woff2'); }
@font-face { font-family: 'Instrument Serif'; font-style: italic; src: url(../../../vendor/fonts/instrument-serif-400-italic.woff2) format('woff2'); }
@font-face { font-family: 'DM Sans'; font-weight: 400; src: url(../../../vendor/fonts/dm-sans-400.woff2) format('woff2'); }
@font-face { font-family: 'DM Sans'; font-weight: 600; src: url(../../../vendor/fonts/dm-sans-600.woff2) format('woff2'); }
:root { --paper: #EFEBE2; --ink: #1A1714; --chili: #B5371F; --cream: #F5EFE4; --wood: #8a5a3b; --board: #22241F; --chalk: #EDE8DC; }
* { margin: 0; box-sizing: border-box; }
html, body { width: 1080px; height: 1920px; overflow: hidden; background: var(--ink); font-family: 'DM Sans', sans-serif; }
#frame { position: absolute; inset: 0; overflow: hidden; }
#world { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; transform-origin: 0 0; }
/* the restaurant: warm wall, pendant lamps, a window */
.bg { position: absolute; inset: 0; }
#resto { background: linear-gradient(#d9b98f 0%, #c9a57a 58%, #b48c63 100%); }
#resto .lamp { position: absolute; top: 0; width: 6px; background: #2b2118; }
#resto .shade { position: absolute; width: 170px; height: 90px; border-radius: 90px 90px 12px 12px; background: var(--ink); }
#resto .glow { position: absolute; width: 420px; height: 420px; border-radius: 50%; background: radial-gradient(rgba(255,220,150,.55), transparent 65%); }
#resto .win { position: absolute; left: 700px; top: 180px; width: 280px; height: 380px; border-radius: 140px 140px 12px 12px; background: linear-gradient(#26324a, #3f4f6b); border: 14px solid #6d4b33; }
#resto .frame-art { position: absolute; left: 110px; top: 230px; width: 220px; height: 170px; background: var(--chili); border: 12px solid #3a2a1d; }
/* the classroom: blackboard wall */
#classroom { background: radial-gradient(ellipse at 50% 30%, #2f332c 0%, var(--board) 70%); opacity: 0; }
#classroom .chalkline { position: absolute; left: 80px; right: 80px; height: 4px; background: rgba(237,232,220,.12); }
#classroom .abc { position: absolute; left: 90px; top: 150px; font-family: 'Instrument Serif'; font-size: 90px; color: rgba(237,232,220,.18); }
/* people */
.peep { position: absolute; transform-origin: 50% 100%; }
.peep svg { width: 100%; height: auto; display: block; }
.peep .face { position: absolute; inset: 0; opacity: 0; }
.peep .face.on { opacity: 1; }
.chair { position: absolute; width: 330px; height: 120px; border-radius: 20px; background: #5a3b27; }
/* the table and the plate */
#table { position: absolute; left: -60px; right: -60px; top: 1330px; height: 700px; background: linear-gradient(#9b6844, #7a5033); border-top: 16px solid #b07a52; }
#plate { position: absolute; left: 470px; top: 1400px; width: 240px; height: 90px; border-radius: 50%; background: #f7f3ea; box-shadow: 0 14px 0 rgba(0,0,0,.18); }
#burger { position: absolute; left: 555px; top: 1392px; width: 70px; }
/* a floating "menu photo" card */
#menu { position: absolute; left: 110px; top: 330px; width: 520px; padding: 26px; border-radius: 26px; background: #fff; box-shadow: 0 30px 80px rgba(0,0,0,.35); transform-origin: 30% 80%; opacity: 0; }
#menu .lab { font-size: 30px; letter-spacing: .16em; text-transform: uppercase; color: var(--chili); font-weight: 600; }
#menu .big { width: 100%; }
#menu .price { font-family: 'Instrument Serif'; font-size: 54px; color: var(--ink); }
/* speech bubbles */
.bubble { position: absolute; max-width: 620px; padding: 22px 30px; border-radius: 34px; background: #fff; color: var(--ink); font-size: 46px; font-weight: 600; line-height: 1.1; box-shadow: 0 12px 30px rgba(0,0,0,.2); opacity: 0; transform-origin: 20% 100%; }
.bubble.madam { background: var(--chili); color: #fff; font-size: 54px; }
.bubble.whisper { background: #f1ede4; color: #5c5349; font-style: italic; font-weight: 400; }
/* captions (burned in, for muted viewers) */
#cap { position: absolute; left: 60px; right: 60px; bottom: 150px; display: flex; justify-content: center; }
#cap > div { padding: 18px 30px 20px; border-radius: 26px; background: rgba(26,23,20,.82); text-align: center; font-size: 50px; font-weight: 600; line-height: 1.12; color: #fff; }
#cap b { color: #FFD28A; font-weight: 600; }
#cap .who { display: block; font-size: 28px; letter-spacing: .18em; text-transform: uppercase; opacity: .8; margin-bottom: 8px; }
/* overlays */
#flash { position: absolute; inset: 0; background: #fff; opacity: 0; }
#puff { position: absolute; inset: 0; pointer-events: none; }
#puff i { position: absolute; border-radius: 50%; background: rgba(245,239,228,.95); }
.stamp { position: absolute; padding: 16px 44px; border: 10px solid var(--chili); color: var(--chili); border-radius: 22px; font-weight: 600; font-size: 130px; letter-spacing: .08em; background: rgba(255,255,255,.85); opacity: 0; }
#board { position: absolute; left: 50px; right: 50px; top: 120px; padding: 46px 50px 40px; border-radius: 28px; background: var(--board); border: 14px solid #6d4b33; box-shadow: 0 30px 80px rgba(0,0,0,.45); opacity: 0; }
#board .over { font-size: 36px; letter-spacing: .2em; text-transform: uppercase; color: #F0B6A8; font-weight: 600; }
#board .q { font-family: 'Instrument Serif'; font-size: 78px; line-height: 1.08; color: var(--chalk); margin-top: 20px; }
#board .q em { color: #F0B6A8; }
#board .blanks { display: flex; gap: 14px; margin-top: 34px; }
#board .bl { width: 64px; height: 84px; border-bottom: 7px solid var(--chalk); opacity: .7; }
#board .bl.hit { border-bottom-color: var(--chili); opacity: 1; position: relative; }
#board .note { font-size: 44px; color: var(--chalk); margin-top: 22px; }
#board .note b { color: #F0B6A8; }
.ruler { position: absolute; width: 1300px; height: 110px; left: -200px; border-radius: 10px; background: linear-gradient(#e2c27a, #caa45b); box-shadow: 0 20px 50px rgba(0,0,0,.35); transform-origin: 0 50%; opacity: 0; }
.ruler::before { content: ''; position: absolute; left: 30px; right: 30px; top: 0; height: 38px; background: repeating-linear-gradient(to right, rgba(60,40,10,.7) 0 3px, transparent 3px 26px); }
#tag { position: absolute; top: 80px; left: 60px; right: 60px; display: flex; justify-content: space-between; font-size: 28px; letter-spacing: .18em; text-transform: uppercase; color: rgba(255,255,255,.85); font-weight: 600; text-shadow: 0 2px 8px rgba(0,0,0,.4); }
#wm { position: absolute; bottom: 70px; left: 0; right: 0; text-align: center; font-family: 'Instrument Serif'; font-size: 48px; color: rgba(255,255,255,.9); }
#wm i { color: var(--chili); font-style: normal; }
</style>
</head>
<body>
<div id="frame">
  <div id="world">
    <div class="bg" id="resto">
      <div class="lamp" style="left:300px;height:120px"></div><div class="shade" style="left:218px;top:110px"></div><div class="glow" style="left:95px;top:20px"></div>
      <div class="lamp" style="left:780px;height:80px"></div><div class="shade" style="left:698px;top:70px"></div><div class="glow" style="left:575px;top:-20px"></div>
      <div class="frame-art"></div><div class="win"></div>
    </div>
    <div class="bg" id="classroom"><div class="abc">a + b = ?</div><div class="chalkline" style="top:1180px"></div></div>
    <div id="people"></div>
    <div id="table"></div>
    <div id="plate"></div>
    <svg id="burger" viewBox="0 0 70 50"><ellipse cx="35" cy="14" rx="30" ry="13" fill="#d9953f"/><rect x="6" y="22" width="58" height="8" rx="4" fill="#5a2d17"/><rect x="4" y="29" width="62" height="5" rx="2" fill="#6ea34a"/><rect x="7" y="34" width="56" height="10" rx="5" fill="#d9953f"/></svg>
    <div id="bubbles"></div>
  </div>
  <div id="menu"><div class="lab">The menu photo</div>
    <svg class="big" viewBox="0 0 70 50"><ellipse cx="35" cy="14" rx="31" ry="13" fill="#e0a04a"/><rect x="4" y="20" width="62" height="5" rx="2" fill="#e7c341"/><rect x="3" y="24" width="64" height="9" rx="4" fill="#5a2d17"/><rect x="2" y="32" width="66" height="5" rx="2" fill="#6ea34a"/><rect x="4" y="36" width="62" height="4" rx="2" fill="#c8402b"/><rect x="6" y="39" width="58" height="10" rx="5" fill="#e0a04a"/></svg>
    <div class="price">"Jumbo" burger</div></div>
  <div class="stamp" id="stamp">FAIL</div>
  <div id="board"><div class="over" id="bover"></div><div class="q" id="bq"></div><div class="blanks" id="bblanks"></div><div class="note" id="bnote"></div></div>
  <div class="ruler" id="ruler"></div>
  <div id="puff"></div>
  <div id="tag"><span id="tagl"></span><span id="tagr"></span></div>
  <div id="cap"></div>
  <div id="wm">menva<i>.</i></div>
  <div id="flash"></div>
</div>
<script>
'use strict';
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const ease = (x) => 1 - Math.pow(1 - clamp(x), 3);
const back = (x) => { x = clamp(x); const c = 1.9; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); };
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const rich = (s) => esc(s).replace(/\*(.+?)\*/g, '<b>$1</b>');
const $ = (id) => document.getElementById(id);
let S; // { cast, seats, tl }

// latest keyframe at or before t in a sorted list of { t, ... }
const at = (list, t, dflt) => { let v = dflt; for (const k of list || []) { if (k.t <= t) v = k; else break; } return v; };

window.load = function (data) {
  S = data;
  // people: one element per seat, holding every expression; madam shares Ayesha's seat
  $('people').innerHTML = Object.entries(S.seats).map(([id, s]) => {
    const faces = Object.entries(S.cast[id]).map(([f, svg]) => `<div class="face" data-f="${f}">${svg}</div>`).join('');
    const madam = id === 'ayesha' ? Object.entries(S.cast.madam).map(([f, svg]) => `<div class="face" data-f="madam:${f}">${svg}</div>`).join('') : '';
    return `<div class="chair" id="chair-${id}" style="left:${s.x + s.size / 2 - 165}px;top:${s.y + s.size - 40}px"></div>` +
      `<div class="peep" id="p-${id}" style="left:${s.x}px;top:${s.y}px;width:${s.size}px;height:${s.size}px">${faces}${madam}</div>`;
  }).join('');
  $('bubbles').innerHTML = S.tl.lines.map((l, i) => `<div class="bubble ${l.style || ''}" id="bb${i}">${rich(l.say)}</div>`).join('');
  const b = S.tl.board;
  $('bover').textContent = b.over; $('bq').innerHTML = esc(b.q).replace(/\*(.+?)\*/g, '<em>$1</em>');
  $('bblanks').innerHTML = [...b.pattern].map((c) => c === ' ' ? '<span style="width:36px"></span>' : `<span class="bl${c === '?' ? ' hit' : ''}"></span>`).join('');
  $('bnote').innerHTML = esc(b.note).replace(/\*(.+?)\*/g, '<b>$1</b>');
  $('puff').innerHTML = Array.from({ length: 26 }, () => '<i></i>').join('');
  $('tagl').textContent = S.tl.tag[0]; $('tagr').textContent = S.tl.tag[1];
  window.render(0);
};

window.render = function (t) {
  const T = S.tl;
  // ── characters: face, talking bounce, fear shake, Zain standing up ──
  for (const [id, seat] of Object.entries(S.seats)) {
    const el = $('p-' + id);
    const face = at(T.faces[id], t, { f: 'calm' }).f;
    el.querySelectorAll('.face').forEach((f) => f.classList.toggle('on', f.dataset.f === face));
    let y = 0, sx = 1, sy = 1, x = 0, rot = 0;
    for (const l of T.lines) if (l.who === id && t >= l.t && t < l.t + l.d) { const k = Math.sin((t - l.t) * 22); sy = 1 + 0.025 * k; sx = 1 - 0.012 * k; y = -6 * Math.abs(k); }
    for (const s of T.shakes || []) if (s.who === id && t >= s.t && t < s.t + s.d) { x = 7 * Math.sin(t * 70); rot = 1.5 * Math.sin(t * 55); }
    for (const p of T.pops || []) if (p.who === id) { const d = t - p.t; if (d >= 0 && d < 0.35) { const k = 1 - ease(d / 0.35); sy *= 1 + 0.12 * k; sx *= 1 - 0.06 * k; } }
    const st = T.stand && T.stand.who === id ? ease((t - T.stand.t) / 0.5) * (t < T.stand.until ? 1 : 1 - ease((t - T.stand.until) / 0.4)) : 0;
    y -= 230 * st;
    el.style.transform = `translate(${x}px,${y}px) rotate(${rot}deg) scale(${sx},${sy})`;
    const ch = $('chair-' + id); if (ch) ch.style.opacity = 1;
  }
  // ── the transformation: flash + chalk puff + restaurant → classroom ──
  const tr = T.transform;
  const cls = t >= tr.t && t < tr.until ? ease((t - tr.t) / 0.25) : (t >= tr.until ? 1 - ease((t - tr.until) / 0.3) : 0);
  $('classroom').style.opacity = cls.toFixed(3);
  $('resto').style.opacity = (1 - cls).toFixed(3);
  $('table').style.filter = `brightness(${1 - 0.35 * cls})`;
  const pd = t - tr.t;
  const seat = S.seats.ayesha;
  $('puff').querySelectorAll('i').forEach((p, i) => {
    const a = i * 2.39996, r = 60 + (i % 5) * 45;
    const k = pd >= 0 && pd < 0.8 ? ease(pd / 0.5) : (pd >= 0.8 ? 1 : 0);
    const cx = seat.x + seat.size / 2 + Math.cos(a) * r * (0.6 + 1.6 * k), cy = seat.y + seat.size * 0.45 + Math.sin(a) * r * (0.6 + 1.6 * k);
    const sz = 26 + (i % 4) * 16;
    p.style.left = cx - sz / 2 + 'px'; p.style.top = cy - sz / 2 + 'px'; p.style.width = p.style.height = sz + 'px';
    p.style.opacity = pd >= 0 && pd < 0.5 ? (1 - clamp((pd - 0.1) / 0.4)).toFixed(3) : 0;
  });
  // puff lives in screen space; keep it aligned with the camera by drawing it inside the camera transform below
  // ── the menu photo card (0 → hide) ──
  const m = T.menu, md = t - m.t;
  $('menu').style.opacity = md >= 0 && t < m.until ? 1 : 0;
  $('menu').style.transform = `rotate(${-6 + 2 * Math.sin(t * 2)}deg) scale(${md >= 0 ? (0.4 + 0.6 * back(md / 0.3)).toFixed(3) : 0.4})`;
  // ── the stamp ──
  const sp = T.stamp, sd = t - sp.t;
  $('stamp').style.opacity = sd >= 0 && t < sp.until ? 1 : 0;
  $('stamp').style.left = sp.x + 'px'; $('stamp').style.top = sp.y + 'px';
  $('stamp').style.transform = `rotate(-10deg) scale(${sd <= 0 ? 3 : (1 + 2 * (1 - ease(sd / 0.12))).toFixed(3)})`;
  // ── the blackboard ──
  const bd = T.board, bt = t - bd.t;
  $('board').style.opacity = bt >= 0 && t < bd.until ? 1 : 0;
  $('board').style.transform = `translateY(${bt >= 0 ? (-900 * (1 - back(bt / 0.35))).toFixed(1) : -900}px) rotate(-1.5deg)`;
  const pw = clamp((bt - 0.3) / bd.write);
  $('bq').style.clipPath = `inset(0 0 ${(100 - pw * 100).toFixed(1)}% 0)`;
  $('bblanks').style.opacity = clamp((bt - 0.3 - bd.write) / 0.2); $('bnote').style.opacity = clamp((bt - 0.5 - bd.write) / 0.2);
  // ── speech bubbles (wide shots) and captions (always) ──
  const cam = at(T.camera, t, { shot: 'wide' });
  T.lines.forEach((l, i) => {
    const b = $('bb' + i), on = t >= l.t && t < l.t + l.d + 0.25;
    const s = S.seats[l.who === 'madam' ? 'ayesha' : l.who];
    const boardOn = t >= T.board.t && t < T.board.until;
    b.style.opacity = on && cam.shot === 'wide' && !boardOn ? 1 : 0;
    b.style.left = Math.min(Math.max(30, s.x + (l.bx || 0)), 1080 - 660) + 'px';
    b.style.top = (s.y - 150 + (l.by || 0)) + 'px';
    b.style.transform = `scale(${on ? (0.6 + 0.4 * back((t - l.t) / 0.2)).toFixed(3) : 0.6})`;
  });
  const cur = [...T.lines].reverse().find((l) => t >= l.t && t < l.t + l.d + 0.25);
  $('cap').innerHTML = cur ? `<div><span class="who">${esc(cur.name)}</span>${rich(cur.say)}</div>` : '';
  // ── camera: wide, or a close-up on one person; a slow push, and a punch + shake on hits ──
  let z = 1, cx = 540, cy = 960;
  if (cam.shot !== 'wide') { const s = S.seats[cam.shot]; z = cam.zoom || 2; cx = s.x + s.size / 2; cy = s.y + s.size * 0.52; }
  z *= 1 + 0.02 * clamp((t - cam.t) / 3);
  let sx = 0, sy = 0, fl = 0;
  for (const h of T.hits) { const d = t - h.t; if (d >= 0 && d < 0.5) { z *= 1 + (h.zoom || 0.05) * (1 - ease(d / 0.3)); const k = Math.exp(-d * 13) * (h.shake || 14); sx += k * Math.sin(d * 95); sy += k * Math.cos(d * 77); if (h.flash && d < 0.12) fl = Math.max(fl, 0.6 * (1 - d / 0.12)); } }
  const tx = 540 - cx * z + sx, ty = 960 - cy * z + sy;
  const clampX = Math.min(0, Math.max(1080 - 1080 * z, tx)), clampY = Math.min(0, Math.max(1920 - 1920 * z, ty));
  $('world').style.transform = `translate(${clampX.toFixed(1)}px,${clampY.toFixed(1)}px) scale(${z.toFixed(4)})`;
  $('puff').style.transform = $('world').style.transform; $('puff').style.transformOrigin = '0 0';
  $('flash').style.opacity = fl.toFixed(3);
  // the ruler slap
  const r = $('ruler'); let rv = null;
  for (const w of T.whacks) { const d = t - w.t; if (d > -0.14 && d < 0.3) rv = { d, y: w.y }; }
  if (rv) { const a = rv.d < 0 ? -55 + 55 * ease((rv.d + 0.14) / 0.14) : -70 * ease(Math.max(0, rv.d - 0.12) / 0.18); r.style.opacity = 1; r.style.top = rv.y + 'px'; r.style.transform = `rotate(${a.toFixed(1)}deg)`; } else r.style.opacity = 0;
};
window.__ready = false;
document.fonts.ready.then(() => { window.__ready = true; });
</script>
</body>
</html>
