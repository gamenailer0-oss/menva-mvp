<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Table Edition</title>
<!-- "Madam ki Class: Table Edition". Four friends at a restaurant table; one of them turns into Madam.
     skit.mjs passes the cast (SVGs) and a timeline; render(t, overlay) draws any moment, so frames are reproducible.
     Motion follows .claude/skills/animation-principles + shot-composition: eased camera moves (one per beat),
     parallax depth (background 0.4x), breathing and blinking, anticipation + settle on expression changes,
     overshoot on entrances, ease-in on exits. -->
<style>
@font-face { font-family: 'Instrument Serif'; src: url(../../../vendor/fonts/instrument-serif-400.woff2) format('woff2'); }
@font-face { font-family: 'Instrument Serif'; font-style: italic; src: url(../../../vendor/fonts/instrument-serif-400-italic.woff2) format('woff2'); }
@font-face { font-family: 'DM Sans'; font-weight: 400; src: url(../../../vendor/fonts/dm-sans-400.woff2) format('woff2'); }
@font-face { font-family: 'DM Sans'; font-weight: 600; src: url(../../../vendor/fonts/dm-sans-600.woff2) format('woff2'); }
:root { --paper: #EFEBE2; --ink: #1A1714; --chili: #B5371F; --cream: #F5EFE4; --board: #22241F; --chalk: #EDE8DC; }
* { margin: 0; box-sizing: border-box; }
html, body { width: 1080px; height: 1920px; overflow: hidden; background: var(--ink); font-family: 'DM Sans', sans-serif; }
#frame { position: absolute; inset: 0; overflow: hidden; }
.layer { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; transform-origin: 0 0; }
.bg { position: absolute; inset: -120px; }
#resto { background: linear-gradient(#d9b98f 0%, #c9a57a 58%, #b48c63 100%); }
#resto .lamp { position: absolute; top: 0; width: 6px; background: #2b2118; }
#resto .shade { position: absolute; width: 170px; height: 90px; border-radius: 90px 90px 12px 12px; background: var(--ink); }
#resto .glow { position: absolute; width: 420px; height: 420px; border-radius: 50%; background: radial-gradient(rgba(255,220,150,.55), transparent 65%); }
#resto .win { position: absolute; left: 820px; top: 300px; width: 280px; height: 380px; border-radius: 140px 140px 12px 12px; background: linear-gradient(#26324a, #3f4f6b); border: 14px solid #6d4b33; }
#resto .frame-art { position: absolute; left: 230px; top: 350px; width: 220px; height: 170px; background: var(--chili); border: 12px solid #3a2a1d; }
#classroom { background: radial-gradient(ellipse at 50% 30%, #2f332c 0%, var(--board) 70%); opacity: 0; }
#classroom .abc { position: absolute; left: 210px; top: 270px; font-family: 'Instrument Serif'; font-size: 90px; color: rgba(237,232,220,.16); }
#classroom .line { position: absolute; left: 200px; right: 200px; top: 1300px; height: 4px; background: rgba(237,232,220,.1); }
.peep { position: absolute; transform-origin: 50% 100%; }
.peep svg { width: 100%; height: auto; display: block; }
.peep .face { position: absolute; inset: 0; opacity: 0; }
.peep .face.on { opacity: 1; }
.chair { position: absolute; width: 330px; height: 120px; border-radius: 20px; background: #5a3b27; }
#table { position: absolute; left: -60px; right: -60px; top: 1330px; height: 700px; background: linear-gradient(#9b6844, #7a5033); border-top: 16px solid #b07a52; }
#plate { position: absolute; left: 470px; top: 1400px; width: 240px; height: 90px; border-radius: 50%; background: #f7f3ea; box-shadow: 0 14px 0 rgba(0,0,0,.18); }
#burger { position: absolute; left: 555px; top: 1392px; width: 70px; }
#menu { position: absolute; width: 470px; padding: 24px; border-radius: 26px; background: #fff; box-shadow: 0 30px 80px rgba(0,0,0,.35); transform-origin: 50% 100%; opacity: 0; }
#menu .lab { font-size: 28px; letter-spacing: .16em; text-transform: uppercase; color: var(--chili); font-weight: 600; }
#menu .big { width: 100%; }
#menu .price { font-family: 'Instrument Serif'; font-size: 52px; color: var(--ink); }
#menu .rows div { font-size: 40px; padding: 10px 0; border-bottom: 2px dashed #ddd3c4; color: var(--ink); }
#menu .rows div b { color: var(--chili); }
#menu .chat p { margin: 10px 0; padding: 12px 18px; border-radius: 18px; background: #efe9dd; font-size: 34px; max-width: 90%; }
#menu .chat p.me { margin-left: auto; background: #d9efc9; }
#menu .huge { font-family: 'Instrument Serif'; font-size: 130px; line-height: 1; color: var(--ink); text-align: center; padding: 10px 0; }
#board { position: absolute; left: 50px; right: 50px; top: 110px; padding: 44px 50px 40px; border-radius: 28px; background: var(--board); border: 14px solid #6d4b33; box-shadow: 0 30px 80px rgba(0,0,0,.45); opacity: 0; transform-origin: 50% 0; }
#board .over { font-size: 34px; letter-spacing: .2em; text-transform: uppercase; color: #F0B6A8; font-weight: 600; }
#board .q { font-family: 'Instrument Serif'; font-size: 76px; line-height: 1.08; color: var(--chalk); margin-top: 18px; }
#board .q em { color: #F0B6A8; }
#board .blanks { display: flex; gap: 14px; margin-top: 30px; }
#board .bl { width: 64px; height: 80px; border-bottom: 7px solid var(--chalk); opacity: .7; }
#board .bl.hit { border-bottom-color: var(--chili); opacity: 1; }
#board .note { font-size: 42px; color: var(--chalk); margin-top: 20px; }
#board .note b { color: #F0B6A8; }
.ruler { position: absolute; width: 1300px; height: 110px; left: -200px; border-radius: 10px; background: linear-gradient(#e2c27a, #caa45b); box-shadow: 0 20px 50px rgba(0,0,0,.35); transform-origin: 0 50%; opacity: 0; }
.ruler::before { content: ''; position: absolute; left: 30px; right: 30px; top: 0; height: 38px; background: repeating-linear-gradient(to right, rgba(60,40,10,.7) 0 3px, transparent 3px 26px); }
#puff i { position: absolute; border-radius: 50%; background: rgba(245,239,228,.95); }
#cap { position: absolute; left: 60px; right: 60px; bottom: 170px; display: flex; justify-content: center; }
#cap > div { padding: 18px 30px 20px; border-radius: 26px; background: rgba(26,23,20,.84); text-align: center; font-size: 50px; font-weight: 600; line-height: 1.12; color: #fff; }
#cap b { color: #FFD28A; font-weight: 600; }
#cap .who { display: block; font-size: 26px; letter-spacing: .18em; text-transform: uppercase; opacity: .75; margin-bottom: 8px; }
#tag { position: absolute; top: 80px; left: 60px; right: 60px; display: flex; justify-content: space-between; font-size: 26px; letter-spacing: .18em; text-transform: uppercase; color: rgba(255,255,255,.85); font-weight: 600; text-shadow: 0 2px 8px rgba(0,0,0,.4); }
#wm { position: absolute; bottom: 80px; left: 0; right: 0; text-align: center; font-family: 'Instrument Serif'; font-size: 46px; color: rgba(255,255,255,.9); }
#wm i { color: var(--chili); font-style: normal; }
#flash { position: absolute; inset: 0; background: #fff; opacity: 0; }
/* cold-open headline */
#headline { position: absolute; left: 60px; right: 60px; top: 190px; text-align: center; opacity: 0; }
#headline span { display: inline-block; padding: 18px 30px; border-radius: 20px; background: var(--cream); color: var(--ink); font-size: 64px; font-weight: 600; line-height: 1.08; letter-spacing: -.02em; box-shadow: 0 16px 40px rgba(0,0,0,.35); }
#headline em { font-family: 'Instrument Serif'; font-style: italic; font-weight: 400; color: var(--chili); }
/* rewind */
#rewind { position: absolute; inset: 0; opacity: 0; background: repeating-linear-gradient(to bottom, rgba(255,255,255,.07) 0 3px, transparent 3px 7px); }
#rewind .rw { position: absolute; left: 0; right: 0; top: 820px; text-align: center; }
#rewind .rw b { display: inline-flex; align-items: center; gap: 22px; padding: 22px 40px; border-radius: 20px; background: rgba(26,23,20,.85); color: #fff; font-size: 64px; font-weight: 600; }
#rewind .tri { width: 0; height: 0; border-top: 22px solid transparent; border-bottom: 22px solid transparent; border-right: 34px solid #fff; display: inline-block; margin-right: -14px; }
/* end card */
#cta { position: absolute; inset: 0; background: var(--chili); display: flex; flex-direction: column; justify-content: center; padding: 0 90px; opacity: 0; }
#cta .big { font-size: 110px; font-weight: 600; line-height: 1.02; letter-spacing: -.03em; color: #fff; }
#cta .big em { font-family: 'Instrument Serif'; font-style: italic; font-weight: 400; color: var(--ink); }
#cta .small { margin-top: 50px; font-size: 40px; color: rgba(255,255,255,.85); line-height: 1.3; }
#cta .wm2 { position: absolute; bottom: 100px; left: 90px; font-family: 'Instrument Serif'; font-size: 64px; color: #fff; }
#cta .wm2 i { color: var(--ink); font-style: normal; }
</style>
</head>
<body>
<div id="frame">
  <div class="layer" id="bgL">
    <div class="bg" id="resto">
      <div class="lamp" style="left:420px;height:240px"></div><div class="shade" style="left:338px;top:230px"></div><div class="glow" style="left:215px;top:140px"></div>
      <div class="lamp" style="left:900px;height:200px"></div><div class="shade" style="left:818px;top:190px"></div><div class="glow" style="left:695px;top:100px"></div>
      <div class="frame-art"></div><div class="win"></div>
    </div>
    <div class="bg" id="classroom"><div class="abc">a + b = ?</div><div class="line"></div></div>
  </div>
  <div class="layer" id="world">
    <div id="people"></div>
    <div id="table"></div>
    <div id="plate"></div>
    <svg id="burger" viewBox="0 0 70 50"><ellipse cx="35" cy="14" rx="30" ry="13" fill="#d9953f"/><rect x="6" y="22" width="58" height="8" rx="4" fill="#5a2d17"/><rect x="4" y="29" width="62" height="5" rx="2" fill="#6ea34a"/><rect x="7" y="34" width="56" height="10" rx="5" fill="#d9953f"/></svg>
    <div id="menu"></div>
    <div id="puff"></div>
  </div>
  <div id="board"><div class="over" id="bover"></div><div class="q" id="bq"></div><div class="blanks" id="bblanks"></div><div class="note" id="bnote"></div></div>
  <div class="ruler" id="ruler"></div>
  <div id="tag"><span id="tagl"></span><span id="tagr"></span></div>
  <div id="headline"><span id="hl"></span></div>
  <div id="cap"></div>
  <div id="wm">menva<i>.</i></div>
  <div id="rewind"><div class="rw"><b><span class="tri"></span><span class="tri"></span>&nbsp; <span id="rwt"></span></b></div></div>
  <div id="cta"><div class="big" id="ctab"></div><div class="small" id="ctas"></div><div class="wm2">menva<i>.</i></div></div>
  <div id="flash"></div>
</div>
<script>
'use strict';
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
// easing (animation-principles quick reference)
const easeOut = (x) => 1 - Math.pow(1 - clamp(x), 3);                         // enter
const easeIn = (x) => Math.pow(clamp(x), 3);                                  // exit
const easeInOut = (x) => { x = clamp(x); return x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; }; // move
const back = (x) => { x = clamp(x); const c = 1.7; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); }; // overshoot
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const rich = (s, tag = 'b') => esc(s).replace(/\*(.+?)\*/g, `<${tag}>$1</${tag}>`);
const $ = (id) => document.getElementById(id);
const lerp = (a, b, k) => a + (b - a) * k;
let S;
const at = (list, t, dflt) => { let v = dflt; for (const k of list || []) { if (k.t <= t) v = k; else break; } return v; };
const prevOf = (list, k) => { const i = list.indexOf(k); return i > 0 ? list[i - 1] : null; };

window.load = function (data) {
  S = data;
  $('people').innerHTML = Object.entries(S.seats).map(([id, s]) => {
    const faces = Object.entries(S.cast[id]).map(([f, svg]) => `<div class="face" data-f="${f}">${svg}</div>`).join('');
    const madam = id === 'ayesha' ? Object.entries(S.cast.madam).map(([f, svg]) => `<div class="face" data-f="madam:${f}">${svg}</div>`).join('') : '';
    return (id === 'guest' ? '' : `<div class="chair" id="chair-${id}" style="left:${s.x + s.size / 2 - 165}px;top:${s.y + s.size - 40}px"></div>`) +
      `<div class="peep" id="p-${id}" style="left:${s.x}px;top:${s.y}px;width:${s.size}px;height:${s.size}px">${faces}${madam}</div>`;
  }).join('');
  window.__board = null;
  $('burger').style.display = S.tl.burger ? '' : 'none';
  $('menu').innerHTML = S.tl.menu.label ? `<div class="lab">${esc(S.tl.menu.label)}</div>${S.tl.menu.html}` : '';
  $('puff').innerHTML = Array.from({ length: 22 }, () => '<i></i>').join('');
  $('tagl').textContent = S.tl.tag[0]; $('tagr').textContent = S.tl.tag[1];
  $('hl').innerHTML = rich(S.tl.headline, 'em');
  $('rwt').textContent = S.tl.rewindText;
  $('ctab').innerHTML = rich(S.tl.cta.big, 'em'); $('ctas').innerHTML = esc(S.tl.cta.small);
  window.render(0, {});
};

// camera target for a keyframe
function camTarget(k) {
  if (!k || k.shot === 'wide') return { z: 1, cx: 540, cy: 960 };
  if (k.cx) return { z: k.zoom || 2, cx: k.cx, cy: k.cy };
  const s = S.seats[k.shot];
  return { z: k.zoom || 2, cx: s.x + s.size / 2, cy: s.y + s.size * (k.face ? 0.42 : 0.52) };
}

window.render = function (t, ov = {}) {
  const T = S.tl;
  // ── characters ──
  for (const [id, seat] of Object.entries(S.seats)) {
    const el = $('p-' + id);
    const fk = at(T.faces[id], t, { t: -9, f: 'calm' });
    let face = fk.f;
    // blink (not in Madam mode): a 0.12 s eyes-closed frame every few seconds, offset per person
    const ph = { ayesha: 0.3, hamza: 1.7, sara: 2.6, zain: 0.9, guest: 2.1 }[id] || 0;
    const bp = (t + ph) % 3.7;
    if (!face.startsWith('madam:') && bp < 0.12 && S.cast[id].eyesClosed && t - fk.t > 0.4) face = 'eyesClosed';
    el.querySelectorAll('.face').forEach((f) => f.classList.toggle('on', f.dataset.f === face));
    // breathing (ambient layer)
    let sy = 1 + 0.012 * Math.sin((t + ph) * 2 * Math.PI / 3.2), sx = 1 - 0.006 * Math.sin((t + ph) * 2 * Math.PI / 3.2);
    let y = 0, x = 0, rot = 0;
    // expression change: anticipation (squash 0.1 s before) then a settle with slight overshoot
    const d = t - fk.t;
    if (fk.t > 0 && d > -0.1 && d < 0) { const k = easeIn((d + 0.1) / 0.1); sy *= 1 - 0.04 * k; sx *= 1 + 0.02 * k; }
    if (fk.t > 0 && d >= 0 && d < 0.35) { const k = 1 - back(d / 0.35); sy *= 1 + 0.05 * k; sx *= 1 - 0.025 * k; }
    // talking: a soft bob and a head nod
    for (const l of T.lines) if ((l.who === id || (l.who === 'madam' && id === 'ayesha')) && t >= l.t && t < l.t + l.d) {
      const k = (t - l.t); sy *= 1 + 0.014 * Math.sin(k * 11); y -= 5 * Math.abs(Math.sin(k * 5.5)); rot += 1.4 * Math.sin(k * 3.8);
    }
    // fear tremble
    for (const s of T.shakes || []) if (s.who === id && t >= s.t && t < s.t + s.d) { const f = Math.min(1, (t - s.t) / 0.15, (s.t + s.d - t) / 0.2); x += 4 * f * Math.sin(t * 38); rot += 0.8 * f * Math.sin(t * 29); }
    // standing on the chair: anticipation dip, rise with overshoot, sit back down with ease-in-out
    // punishments: stand on the chair (up), murga (down, squashed), class se bahar (slides out of frame)
    const P = T.stand;
    if (P && P.who === id) {
      const u = t - P.t;
      let k = 0;
      if (u > -0.15 && u < 0) k = -0.08 * easeIn((u + 0.15) / 0.15);
      else if (u >= 0 && t < P.until) k = P.kind === 'out' ? easeIn(u / 0.6) : back(u / 0.55);
      else if (t >= P.until) k = 1 - (P.kind === 'out' ? easeOut((t - P.until) / 0.6) : easeInOut((t - P.until) / 0.5));
      if (P.kind === 'duck') { y += (seat.y < 700 ? 110 : 200) * k; sy *= 1 - 0.14 * Math.max(0, k); sx *= 1 + 0.08 * Math.max(0, k); rot += 6 * Math.max(0, k); }
      else if (P.kind === 'out') { x += (seat.x > 400 ? 1 : -1) * 800 * Math.max(0, k); rot += (seat.x > 400 ? 8 : -8) * Math.max(0, k); }
      else y -= 230 * k;
    }
    // a guest walks in from the right (hidden before), with an overshoot settle
    if (T.enter && T.enter.who === id) { const u = t - T.enter.t; if (u < 0) x += 1400; else x += 900 * (1 - back(u / 0.6)); }
    el.style.transform = `translate(${x.toFixed(1)}px,${y.toFixed(1)}px) rotate(${rot.toFixed(2)}deg) scale(${sx.toFixed(4)},${sy.toFixed(4)})`;
  }
  // ── the transformation: flash + chalk puff + restaurant to classroom ──
  const tr = T.transform;
  const cls = t >= tr.t && t < tr.until ? easeOut((t - tr.t) / 0.3) : (t >= tr.until ? 1 - easeInOut((t - tr.until) / 0.45) : 0);
  $('classroom').style.opacity = cls.toFixed(3); $('resto').style.opacity = (1 - cls).toFixed(3);
  $('table').style.filter = `brightness(${(1 - 0.3 * cls).toFixed(3)})`;
  const seat = S.seats.ayesha;
  const puffs = [tr.t, tr.until];
  $('puff').querySelectorAll('i').forEach((p, i) => {
    let best = null; for (const pt of puffs) { const pd = t - pt; if (pd >= 0 && pd < 0.55) best = pd; }
    if (best === null) { p.style.opacity = 0; return; }
    const a = i * 2.39996, r = 70 + (i % 5) * 40, k = easeOut(best / 0.55);
    const cx = seat.x + seat.size / 2 + Math.cos(a) * r * (0.5 + 1.5 * k), cy = seat.y + seat.size * 0.4 + Math.sin(a) * r * (0.5 + 1.5 * k);
    const sz = (22 + (i % 4) * 14) * (1 - 0.4 * k);
    p.style.left = cx - sz / 2 + 'px'; p.style.top = cy - sz / 2 + 'px'; p.style.width = p.style.height = sz + 'px';
    p.style.opacity = (1 - easeIn(best / 0.55)).toFixed(3);
  });
  // ── the menu photo: Zain holds it up (enter: rise with overshoot; exit: ease-in drop) ──
  const m = T.menu, zs = S.seats[m.holder || 'zain'];
  let mk = 0; if (t >= m.t && t < m.until) mk = back((t - m.t) / 0.45); else if (t >= m.until) mk = 1 - easeIn((t - m.until) / 0.25);
  $('menu').style.opacity = mk > 0.01 && m.label ? 1 : 0;
  // never over a face: back row holds it beside them, front row puts it down at table level
  const front = zs.y > 700;
  const mx = front ? (zs.x > 400 ? zs.x - 40 : zs.x + 60) : (zs.x > 400 ? zs.x - 390 : zs.x + zs.size - 60);
  const my = front ? 1150 : zs.y + zs.size * 0.3;
  $('menu').style.left = Math.min(1080 - 500, Math.max(10, mx)) + 'px'; $('menu').style.top = my + 'px';
  $('menu').style.transform = `translateY(${(260 * (1 - mk)).toFixed(1)}px) rotate(${(-8 + 2 * Math.sin(t * 2.2)).toFixed(2)}deg) scale(${(0.4 + 0.4 * mk).toFixed(3)})`;
  // ── the blackboard: drops with overshoot and a small swing, leaves upward ──
  let bd = T.boards[0];
  for (const b of T.boards) if (t >= b.t - 0.01) bd = b;
  if (bd !== window.__board) { window.__board = bd; $('bover').textContent = bd.over; $('bq').innerHTML = rich(bd.q, 'em');
    $('bblanks').innerHTML = [...bd.pattern].map((c) => c === ' ' ? '<span style="width:36px"></span>' : `<span class="bl${c === '?' ? ' hit' : ''}"></span>`).join('');
    $('bnote').innerHTML = rich(bd.note); }
  const bt = t - bd.t;
  let bk = 0, swing = 0;
  if (bt >= 0 && t < bd.until) { bk = back(bt / 0.5); swing = 2.5 * Math.exp(-bt * 5) * Math.sin(bt * 14); }
  else if (t >= bd.until) bk = 1 - easeIn((t - bd.until) / 0.3);
  $('board').style.opacity = bk > 0.01 ? 1 : 0;
  $('board').style.transform = `translateY(${(-1000 * (1 - bk)).toFixed(1)}px) rotate(${(-1.5 + swing).toFixed(2)}deg)`;
  const pw = clamp((bt - 0.45) / bd.write);
  $('bq').style.clipPath = `inset(0 0 ${(100 - pw * 100).toFixed(1)}% 0)`;
  $('bblanks').style.opacity = clamp((bt - 0.45 - bd.write) / 0.25); $('bnote').style.opacity = clamp((bt - 0.7 - bd.write) / 0.25);
  // ── captions ──
  const cur = [...T.lines].reverse().find((l) => t >= l.t && t < l.t + l.d + 0.3);
  $('cap').innerHTML = cur ? `<div style="opacity:${clamp((t - cur.t) / 0.12).toFixed(2)}"><span class="who">${esc(cur.name)}</span>${rich(cur.say)}</div>` : '';
  // ── camera: ease-in-out move from the previous shot to the current one; blur only while moving fast ──
  const ck = at(T.camera, t, { t: 0, shot: 'wide' });
  const from = camTarget(prevOf(T.camera, ck) || ck), to = camTarget(ck);
  const mv = ck.move ?? 0.5;
  const k = mv > 0 ? easeInOut((t - ck.t) / mv) : 1;
  let z = lerp(from.z, to.z, k), cx = lerp(from.cx, to.cx, k), cy = lerp(from.cy, to.cy, k);
  z *= 1 + 0.03 * easeInOut(clamp((t - ck.t - mv) / 4)); // slow push while a shot holds
  let sx = 0, sy = 0, fl = 0;
  for (const h of T.hits) { const d = t - h.t; if (d >= 0 && d < 0.45) { z *= 1 + (h.zoom || 0.05) * (1 - easeOut(d / 0.3)); const a = Math.exp(-d * 12) * (h.shake || 12); sx += a * Math.sin(d * 70); sy += a * Math.cos(d * 55); if (h.flash && d < 0.12) fl = Math.max(fl, 0.6 * (1 - d / 0.12)); } }
  const tx = 540 - cx * z + sx, ty = 960 - cy * z + sy;
  const X = Math.min(0, Math.max(1080 - 1080 * z, tx)), Y = Math.min(0, Math.max(1920 - 1920 * z, ty));
  $('world').style.transform = `translate(${X.toFixed(1)}px,${Y.toFixed(1)}px) scale(${z.toFixed(4)})`;
  // parallax: the background moves at ~40% of the camera (depth)
  const bz = 1 + (z - 1) * 0.4;
  $('bgL').style.transform = `translate(${((540 - cx * bz) * 0.9 + sx * 0.4).toFixed(1)}px,${((960 - cy * bz) * 0.9 + sy * 0.4).toFixed(1)}px) scale(${bz.toFixed(4)})`;
  const speed = mv > 0 && t - ck.t < mv ? Math.sin(Math.PI * clamp((t - ck.t) / mv)) : 0;
  // motion blur only on fast moves (whips), never on slow cinematic pushes
  const fast = clamp((0.6 - mv) / 0.35);
  const blur = fast * speed * Math.min(5, Math.abs(to.z - from.z) * 3 + Math.hypot(to.cx - from.cx, to.cy - from.cy) / 120);
  $('world').style.filter = blur > 0.3 ? `blur(${blur.toFixed(1)}px)` : '';
  $('bgL').style.filter = blur > 0.3 ? `blur(${(blur * 1.4).toFixed(1)}px)` : '';
  $('flash').style.opacity = fl.toFixed(3);
  // ── the ruler slap (anticipation up, fast strike, recoil) ──
  const r = $('ruler'); let rv = null;
  for (const w of T.whacks) { const d = t - w.t; if (d > -0.16 && d < 0.32) rv = { d, y: w.y }; }
  if (rv) { const a = rv.d < 0 ? -60 + 60 * easeIn((rv.d + 0.16) / 0.16) : -65 * easeInOut(Math.max(0, rv.d - 0.1) / 0.22); r.style.opacity = 1; r.style.top = rv.y + 'px'; r.style.transform = `rotate(${a.toFixed(1)}deg)`; } else r.style.opacity = 0;
  // ── overlays: cold-open headline, rewind, end card ──
  const hk = ov.headline ?? 0;
  $('headline').style.opacity = hk.toFixed(3); $('headline').style.transform = `translateY(${(-30 * (1 - hk)).toFixed(1)}px) scale(${(0.9 + 0.1 * hk).toFixed(3)})`;
  $('rewind').style.opacity = (ov.rewind ?? 0).toFixed(3);
  const ctaK = ov.cta ?? 0;
  $('cta').style.opacity = clamp(ctaK * 3).toFixed(3);
  $('ctab').style.transform = `translateY(${(60 * (1 - back(ctaK))).toFixed(1)}px)`;
  $('ctas').style.opacity = clamp(ctaK * 2 - 0.6).toFixed(3);
};
window.__ready = false;
document.fonts.ready.then(() => { window.__ready = true; });
</script>
