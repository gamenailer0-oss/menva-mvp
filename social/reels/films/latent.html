<!--
  BHOOK'S GOT LATENT: a 3D claymation parody of a roast talent show. About 67 s, shot at 12 drawings a second.
  Original cast (Fazi the deadpan host, Nusrat Aunty, sleepy Chacha, Vlogger Bhai, contestants Pappu and Mehwish),
  no real show name, people or voices. Every joke dies: silence, a cough, then the HASO light and a canned laugh
  that cuts off. Pappu orders from menu photos and gets a tiny clay burger (a cartoon). Mehwish scans the table QR,
  the REAL dish scan turns on her phone, her self-rating matches, and the audience laughs for real with the light off.
  Timing, dialogue and mouth shapes come from ../latent/timeline.json (built by timeline.py from the recorded lines),
  so picture and sound share one clock. Clay look: lumpy plasticine shader with fingerprints and a per-drawing boil,
  replacement mouths, stepped camera moves with tiny bumps, soft spot lights, bloom on practicals, depth of field on macro.
-->
