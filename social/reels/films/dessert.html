<!--
  Film 1: DESSERT, toon 3D. 13.5 s at 120 BPM (beat 0.5 s).
  Story: the menu shows a perfect cake. The plate brings a tiny, sweating one. Scan the QR: the cake you saw lands for real.
  Every cake here is a cartoon (toon-shaded, ink outlines): no dessert scan exists yet, and no food is ever made to look real.
  Motion language: kinetic + soft (Playful). Squash and stretch on every landing, playful springs with overshoot on objects,
  titles land with a small eBack punch. Base unit 0.25 s. Transitions: card flip into 3D, pink iris out to the end card.
