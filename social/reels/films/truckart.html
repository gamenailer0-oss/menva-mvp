<!doctype html><html><head><meta charset="utf-8">
<!--
  Film 12: TRUCKART, Pakistani truck art. 12.4 s, dhol chaal at 130 BPM.
  Story: the back panel of a painted truck assembles tile by tile on the dhol. Painted eyes blink. Shayari:
  "Photo pe na jao, plate pe aao." A medallion shows a QR built from mirror tiles: "Scan karo, jaani!".
  Then the punchline in the classic truck style: "DEKH MAGAR SCAN SE". Bells and chains swing on every beat.
  Look: deep red and teal panels, chamak patti (mirror tape) diamond borders that shimmer, scalloped edges,
  five-petal florals, gold lettering with red and black outlines. Motion language: on the dhol, tiles flip in on beats,
  things swing like pendulums, shimmer travels across the mirrors; text stamps in with a short bounce.
-->
<style>html,body{margin:0;width:1080px;height:1920px;overflow:hidden;background:#0E3B43}canvas{position:absolute;left:0;top:0}</style>
</head><body><canvas id="c" width="1080" height="1920"></canvas>
<script type="module">
import { W, H, PAPER, INK, clamp, lerp, inv, eO, eI, eIO, eBack, spring, SPRING, hash, loadFonts, T, endCard, cues } from './common.js';
await loadFonts('rye', 'shade');
const x = document.getElementById('c').getContext('2d');
const C = cues(), cue = C.add;
const B = 60 / 130;
const RED = '#C8102E', TEAL = '#0E7C86', DTEAL = '#0E3B43', GOLD = '#F6C744', GRN = '#2FA84F', BLU = '#1C5BD9', PINK = '#F06BA8', ORG = '#F58A1F';
const MIRROR = [RED, GOLD, GRN, BLU, '#D9DDE3', PINK, ORG];

function mirrorStrip(x0, y0, len, horiz, t, size = 34, seed = 0, appear = 1) {
  const n = Math.floor(len / size);
  for (let i = 0; i < n; i++) {
    const k = clamp(appear * n * 1.2 - i);
    if (k <= 0) continue;
    const cx = horiz ? x0 + i * size + size / 2 : x0, cy = horiz ? y0 : y0 + i * size + size / 2;
    const shine = Math.max(0, Math.sin(t * 5 - i * 0.35 + seed)) ** 6;
    x.save(); x.translate(cx, cy); x.scale(k, k);
    x.fillStyle = MIRROR[(i + seed) % MIRROR.length]; x.beginPath(); x.moveTo(0, -size / 2); x.lineTo(size / 2, 0); x.lineTo(0, size / 2); x.lineTo(-size / 2, 0); x.fill();
    x.fillStyle = `rgba(255,255,255,${0.15 + shine * 0.85})`; x.beginPath(); x.moveTo(0, -size / 2); x.lineTo(size / 4, -size / 4); x.lineTo(0, 0); x.lineTo(-size / 4, -size / 4); x.fill();
    x.restore();
  }
}
function scallops(y, col, r = 30, flip = 1) { x.fillStyle = col; for (let i = -1; i < W / (r * 2) + 1; i++) { x.beginPath(); x.arc(i * r * 2 + r, y, r, flip > 0 ? 0 : Math.PI, flip > 0 ? Math.PI : Math.PI * 2); x.fill(); } }
function flower(cx, cy, r, c1, c2, rot, p = 1) {
  if (p <= 0) return; x.save(); x.translate(cx, cy); x.rotate(rot); x.scale(p, p);
  for (let i = 0; i < 5; i++) { x.save(); x.rotate(i / 5 * Math.PI * 2); const g = x.createLinearGradient(0, 0, 0, -r); g.addColorStop(0, c2); g.addColorStop(1, c1); x.fillStyle = g;
    x.beginPath(); x.moveTo(0, 0); x.bezierCurveTo(r * 0.6, -r * 0.3, r * 0.5, -r, 0, -r); x.bezierCurveTo(-r * 0.5, -r, -r * 0.6, -r * 0.3, 0, 0); x.fill(); x.strokeStyle = 'rgba(0,0,0,.35)'; x.lineWidth = 2; x.stroke(); x.restore(); }
  x.fillStyle = GOLD; x.beginPath(); x.arc(0, 0, r * 0.22, 0, 7); x.fill(); x.fillStyle = RED; x.beginPath(); x.arc(0, 0, r * 0.1, 0, 7); x.fill(); x.restore();
}
function eye(cx, cy, s, blink) {
  x.save(); x.translate(cx, cy); x.scale(s, s);
  x.fillStyle = '#fff'; x.beginPath(); x.moveTo(-110, 0); x.quadraticCurveTo(0, -80 * (1 - blink), 110, 0); x.quadraticCurveTo(0, 80 * (1 - blink), -110, 0); x.fill();
  if (blink < 0.8) { x.save(); x.clip(); x.fillStyle = TEAL; x.beginPath(); x.arc(0, 0, 46, 0, 7); x.fill(); x.fillStyle = '#111'; x.beginPath(); x.arc(0, 0, 22, 0, 7); x.fill(); x.fillStyle = '#fff'; x.beginPath(); x.arc(-14, -14, 9, 0, 7); x.fill(); x.restore(); }
  x.strokeStyle = '#111'; x.lineWidth = 9; x.beginPath(); x.moveTo(-110, 0); x.quadraticCurveTo(0, -80 * (1 - blink), 110, 0); x.stroke();
  for (let i = 0; i < 7; i++) { const a = -0.9 + i * 0.3; x.beginPath(); x.moveTo(Math.cos(a + Math.PI) * -100 * 0.9, -40 * (1 - blink) - 10 + Math.abs(i - 3) * 4); x.lineTo(Math.cos(a + Math.PI) * -120, -70 * (1 - blink) - 10); x.stroke(); }
  x.strokeStyle = GOLD; x.lineWidth = 8; x.beginPath(); x.moveTo(-130, -90); x.quadraticCurveTo(0, -150, 130, -90); x.stroke();
  x.restore();
}
function painted(s, cx, cy, z, p, { font = 'Rye', fill = GOLD, rot = 0 } = {}) {
  if (p <= 0) return; const k = p < 1 ? eBack(clamp(p), 1.8) : 1;
  x.save(); x.translate(cx, cy); x.rotate(rot); x.scale(k, k); x.font = `400 ${z}px ${font}`; x.textAlign = 'center'; x.textBaseline = 'middle'; x.lineJoin = 'round';
  x.lineWidth = z * 0.24; x.strokeStyle = '#111'; x.strokeText(s, 5, 8); x.lineWidth = z * 0.14; x.strokeStyle = RED; x.strokeText(s, 0, 0);
  const g = x.createLinearGradient(0, -z / 2, 0, z / 2); g.addColorStop(0, '#FFF3B0'); g.addColorStop(0.5, fill); g.addColorStop(1, '#D98E1C'); x.fillStyle = g; x.fillText(s, 0, 0); x.restore();
}
function bells(t) {
  for (let i = 0; i < 9; i++) {
    const bx = 70 + i * 117, beat = (t / B) % 1, sw = Math.sin(t * 6 + i * 0.7) * 0.25 * (0.5 + 0.5 * Math.exp(-beat * 4));
    x.save(); x.translate(bx, 1650); x.rotate(sw);
    x.strokeStyle = '#C9CED6'; x.lineWidth = 3; for (let k = 0; k < 6; k++) { x.beginPath(); x.ellipse(0, k * 22, 6, 11, 0, 0, 7); x.stroke(); }
    x.fillStyle = GOLD; x.beginPath(); x.moveTo(-22, 160); x.quadraticCurveTo(-20, 125, 0, 125); x.quadraticCurveTo(20, 125, 22, 160); x.closePath(); x.fill(); x.fillStyle = '#B07A12'; x.beginPath(); x.arc(0, 164, 6, 0, 7); x.fill();
    x.restore();
  }
}
function qrMirror(cx, cy, size, t, p) {
  const Q = window.QR, cell = size / Q.size;
  x.save(); x.translate(cx - size / 2, cy - size / 2);
  x.fillStyle = '#F7F1E1'; x.fillRect(-14, -14, size + 28, size + 28);
  for (let r = 0; r < Q.size; r++) for (let c = 0; c < Q.size; c++) if (Q.data[r * Q.size + c]) {
    const k = clamp(p * 1.6 - (r + c) / (Q.size * 2)); if (k <= 0) continue;
    const shine = Math.max(0, Math.sin(t * 4 - (r + c) * 0.3)) ** 8;
    x.fillStyle = shine > 0.2 ? `rgb(${120 + shine * 135},${120 + shine * 135},${140 + shine * 115})` : '#111';
    x.fillRect(c * cell + cell * (1 - k) / 2, r * cell + cell * (1 - k) / 2, cell * k, cell * k);
  }
  x.restore();
}
const S = { build: 0, eyes: 1.85, sh1: 2.77, sh1b: 3.69, qr: 5.08, qrcap: 6.0, punch: 7.85, punch2: 8.77, end: 9.69 };
cue(0, 'drop'); for (let i = 0; i < 4; i++) cue(i * B, 'dhum', { g: 0.4 }); cue(S.eyes, 'ghungroo'); cue(S.sh1, 'impact', { big: 0.4, g: 0.35 }); cue(S.sh1b, 'dhum', { g: 0.45 });
cue(S.qr, 'flash', { g: 0.4 }); cue(S.qrcap, 'ghungroo'); cue(S.punch, 'impact', { big: 0.6, g: 0.5 }); cue(S.punch2, 'dhum', { g: 0.5 }); cue(S.punch2 + 0.1, 'ghungroo'); cue(S.end, 'end'); cue(S.end + 0.3, 'ting', { m: 81, g: 0.45 });

function panel(t) {
  const ap = inv(0, 1.6, t);
  x.fillStyle = DTEAL; x.fillRect(0, 0, W, H);
  // central red field with a teal inner panel
  x.fillStyle = RED; x.fillRect(40, 140, W - 80, 1460); x.fillStyle = TEAL; x.beginPath(); x.roundRect(90, 220, W - 180, 1300, 60); x.fill();
  scallops(140, GOLD, 26, -1); scallops(1600, GOLD, 26, 1);
  mirrorStrip(40, 120, W - 80, true, t, 36, 0, ap); mirrorStrip(40, 1620, W - 80, true, t, 36, 3, ap);
  mirrorStrip(30, 140, 1460, false, t, 36, 1, ap); mirrorStrip(W - 30, 140, 1460, false, t, 36, 5, ap);
  // corner florals
  [[150, 280], [930, 280], [150, 1460], [930, 1460]].forEach(([fx, fy], i) => flower(fx, fy, 70, [PINK, GOLD, ORG, PINK][i], '#FFF', t * 0.4 + i, spring(t - 0.3 - i * B / 2, ...SPRING.playful)));
  bells(t);
}
function draw(t) {
  x.clearRect(0, 0, W, H);
  if (t >= S.end) { x.fillStyle = DTEAL; x.fillRect(0, 0, W, H); mirrorStrip(40, 1560, W - 80, true, t, 30, 2, 1); mirrorStrip(40, 360, W - 80, true, t, 30, 4, 1); endCard(x, t, S.end, { ink: PAPER, sub: '#bfe3df' }); return; }
  panel(t);
  if (t < S.qr) {
    const bl = (tt) => { const k = (tt % 2.2) / 2.2; return k > 0.92 ? Math.sin((k - 0.92) / 0.08 * Math.PI) : 0; };
    if (t < S.sh1) { const out = 1 - eI(inv(S.eyes - 0.2, S.eyes + 0.2, t));
      [[540, 960, 150, PINK], [360, 820, 90, GOLD], [720, 820, 90, ORG], [360, 1100, 90, ORG], [720, 1100, 90, GOLD], [540, 700, 70, PINK], [540, 1220, 70, PINK]].forEach(([fx, fy, fr, fc], i) =>
        flower(fx, fy, fr, fc, '#fff', t * (i % 2 ? 0.5 : -0.5) + i, clamp(spring(t - 0.15 - i * B / 2, ...SPRING.playful), 0, 1.1) * out)); }
    const ep = spring(t - S.eyes, ...SPRING.playful);
    if (ep > 0) { eye(330, 560, 1.15 * clamp(ep), bl(t)); eye(750, 560, 1.15 * clamp(ep), bl(t + 0.05)); }
    painted('Photo pe na jao,', W / 2, 900, 96, (t - S.sh1) / 0.3);
    painted('plate pe aao.', W / 2, 1060, 112, (t - S.sh1b) / 0.3, { fill: '#FFE07A' });
    flower(W / 2, 1300, 90, PINK, '#fff', t * 0.6, spring(t - S.sh1b - 0.3, ...SPRING.playful));
  } else if (t < S.punch) {
    const p = inv(S.qr, S.qr + 0.8, t);
    x.save(); x.fillStyle = GOLD; x.beginPath(); x.arc(W / 2, 760, 330 * clamp(spring(t - S.qr, ...SPRING.playful), 0, 1.1), 0, 7); x.fill(); x.fillStyle = RED; x.beginPath(); x.arc(W / 2, 760, 300 * clamp(spring(t - S.qr, ...SPRING.playful), 0, 1.1), 0, 7); x.fill(); x.restore();
    for (let i = 0; i < 12; i++) flower(W / 2 + Math.cos(i / 12 * Math.PI * 2 + t * 0.3) * 315, 760 + Math.sin(i / 12 * Math.PI * 2 + t * 0.3) * 315, 34, i % 2 ? GOLD : PINK, '#fff', t + i, clamp(p * 2 - i / 12));
    qrMirror(W / 2, 760, 330, t, p);
    painted('Scan karo,', W / 2, 1250, 110, (t - S.qrcap) / 0.3);
    painted('jaani!', W / 2, 1400, 130, (t - S.qrcap - 0.3) / 0.3, { fill: '#FFE07A', rot: -0.04 });
  } else {
    painted('DEKH', W / 2, 640, 210, (t - S.punch) / 0.3, { font: 'Shade' });
    painted('MAGAR', W / 2, 880, 175, (t - S.punch - 0.25) / 0.3, { font: 'Shade' });
    painted('SCAN SE', W / 2, 1120, 158, (t - S.punch2) / 0.3, { font: 'Shade', fill: '#FFE07A' });
    flower(220, 1350, 70, PINK, '#fff', t, spring(t - S.punch2, ...SPRING.playful)); flower(860, 1350, 70, GOLD, '#fff', -t, spring(t - S.punch2 - 0.1, ...SPRING.playful));
  }
}
window.DUR = 12.4;
window.FILM = { preset: 'dhol', bpm: 130, cover: 11.9 };
window.CUES = C.list;
window.seek = (t) => { draw(t); return true; };
window.seek(0);
window.__ready = true;
</script></body></html>
