  const top = new THREE.Mesh(new THREE.CylinderGeometry(0.55, 0.55, 0.06, 20), flat(hero ? 0xE9E1D3 : 0xD9CFBF)); top.position.y = 0.75; top.castShadow = top.receiveShadow = true; g.add(top);

const hero = table(0.2, -3.9, true);
for (let i = -22; i <= 22; i += 3.6) if (Math.abs(i - 0.2) > 2) table(i, -3.9 + (R() - 0.5) * 0.5);

const gltf = await new GLTFLoader().setDRACOLoader(new DRACOLoader().setDecoderPath('/vendor/draco/')).loadAsync('/assets/dishes/bz-chicken-pizza/model.glb');
const dish = gltf.scene; dish.traverse((o) => { if (o.isMesh) { o.castShadow = true; o.receiveShadow = true; } }); dish.position.set(-0.05, 0.78, -0.02); dish.rotation.y = -0.5; hero.add(dish);

const composer = new EffectComposer(r); composer.addPass(new RenderPass(scene, cam));

const tilt = (dir) => new ShaderPass({ uniforms: { tDiffuse: { value: null }, dir: { value: dir }, focus: { value: 0.5 }, band: { value: 0.12 }, amt: { value: 1.0 } },
  vertexShader: 'varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }',
