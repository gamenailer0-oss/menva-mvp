<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>MENVA reel</title>
<!-- A 1080×1920 motion Reel, drawn frame by frame: make.mjs calls window.render(t) for each frame
     time and screenshots it, so the video is exact and repeatable. Scenes live in reels.js. -->
<link rel="stylesheet" href="../templates/post.css">
<style>
  html, body { width: 1080px; height: 1920px; overflow: hidden; }
  #stage { position: relative; width: 1080px; height: 1920px; overflow: hidden; }
  .scene { position: absolute; inset: 0; padding: 250px 90px 340px; display: flex; flex-direction: column; opacity: 0; }
  .a { will-change: transform, opacity; }
  .big { font-family: var(--serif); font-size: 150px; line-height: .95; letter-spacing: -0.02em; }
  .mid { font-family: var(--serif); font-size: 104px; line-height: 1; letter-spacing: -0.015em; }
  .big em, .mid em { font-style: italic; color: var(--chili); }
  .bg-chili .big em, .bg-chili .mid em, .bg-ink .big em, .bg-ink .mid em { color: var(--cream); }
  .small { font-size: 40px; line-height: 1.35; }
  .center { align-items: center; justify-content: center; text-align: center; }
  .floor { position: absolute; left: 0; right: 0; bottom: 0; height: 46%; background: var(--sand); border-top: 2px solid var(--line); }
  .reticle { position: absolute; left: 50%; top: 64%; width: 820px; height: 270px; margin-left: -410px; margin-top: -135px; border: 4px solid #fff; border-radius: 50%; }
  .dishimg { position: absolute; left: 50%; top: 58%; }
  .shadow { position: absolute; left: 50%; top: 66%; width: 700px; height: 120px; margin-left: -350px; margin-top: -60px; border-radius: 50%; background: radial-gradient(closest-side, rgba(26,23,20,.28), rgba(26,23,20,0)); }
  .count { font-family: var(--serif); font-size: 420px; line-height: 1; color: var(--chili); }
  .tag { display: inline-block; background: var(--surface); color: var(--ink); border-radius: 999px; padding: 18px 34px; font-size: 36px; font-weight: 600; }
  .menu-card { background: #fff; border: 2px solid var(--line); border-radius: 40px; padding: 70px 64px; }
  .menu-card .name { font-family: var(--serif); font-size: 96px; line-height: 1; }
  .menu-card .desc { font-size: 38px; color: var(--muted); margin-top: 26px; }
  .dots { border-bottom: 4px dotted var(--line); margin-top: 30px; }
  .qs div { border: 2px solid rgba(255,255,255,.3); border-radius: 30px; padding: 34px 40px; font-family: var(--serif); font-size: 64px; margin-bottom: 26px; }
  .wm { font-family: var(--serif); font-size: 120px; letter-spacing: -0.02em; }
  .wm i { font-style: normal; color: var(--chili); }
  .bg-chili .wm i { color: var(--ink); }
</style>
</head>
<body><div id="stage"></div>
<script src="reels.js"></script>
</body>
</html>
