  One 1080×1350 Instagram slide, drawn from the data in the URL:
    post.html?d=<base64url(JSON)>      (what the n8n workflow sends to Gotenberg)

  When everything (fonts + dish image) has loaded, window.__ready becomes true —
  Gotenberg waits for that before taking the screenshot.
-->
