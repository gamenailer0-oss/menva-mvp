<svg viewBox="0 0 240 100" xmlns="http://www.w3.org/2000/svg" fill="none">
  <!-- Notched bracket frame (like the Gauchos brand mark) -->
  <path d="M12 4 L228 4 L236 12 L236 88 L228 96 L12 96 L4 88 L4 12 Z" 
        fill="none" stroke="#8B2F1F" stroke-width="2.5"/>
  <!-- Inner accent line -->
  <path d="M16 8 L224 8 L232 16 L232 84 L224 92 L16 92 L8 84 L8 16 Z" 
        fill="none" stroke="#8B2F1F" stroke-width="0.5" opacity="0.4"/>
  <!-- GAUCHOS text -->
  <text x="120" y="50" font-family="Georgia, 'Times New Roman', serif" font-size="32" font-weight="bold" fill="#8B2F1F" text-anchor="middle" letter-spacing="3">GAUCHOS</text>
  <!-- Divider -->
  <line x1="70" y1="60" x2="170" y2="60" stroke="#8B2F1F" stroke-width="0.8" opacity="0.5"/>
  <!-- STEAK HOUSE text -->
  <text x="120" y="78" font-family="Georgia, 'Times New Roman', serif" font-size="11" fill="#8B2F1F" text-anchor="middle" letter-spacing="5">STEAK HOUSE</text>
</svg>
